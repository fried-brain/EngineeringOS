[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineeringos"
version = "0.1.0"
description = "Engineering role mastery toolkit and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
engineeringos = "engineeringos.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
engineeringos = ["roles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
